# min_filter:                                   
#   enable: True                                # weather to load this plugin
#   fill_nan: True                             # Fill nans to invalid cells of elevation layer.
#   is_height_layer: True                       # If this is a height layer (such as elevation) or not (such as traversability)
#   layer_name: "min_filter"                    # The layer name.
#   extra_params:                               # This params are passed to the plugin class on initialization.
#     dilation_size: 1                         # The patch size to apply (21x21 patch - very large for smoothing)
#     iteration_n: 15                           # The number of iterations. Increased to better smooth false height differences during orientation changes.

slope:
  enable: True
  fill_nan: False                             # Don't fill NaNs (Slope is only valid where normals exist)
  is_height_layer: False                      # Slope is an angle, not a height
  layer_name: "slope"
  
  extra_params:
    output_units: "degrees"                   # Output in degrees [0, 90]
       
    # 1. Spatial Filter (Median): Reduces high-frequency sensor noise (e.g., "salt-and-pepper").
    spatial_filter_size: 3                    # Kernel size (5x5). Higher value = more smoothing.
                                              # To DISABLE: Set to 1.
    
    # 2. Temporal Smoothing (Exponential Moving Average / EMA)
    # Rejects transient (single-frame) noise and stabilizes slopes over time.
    temporal_alpha: 0.7                       # EMA factor (0.7 = 70% current, 30% history).
                                              # To DISABLE: Set to 1.0. 
    
    # 3. Confidence Weighting (Variance and Time Decay)
    
    # Controls the penalization of low-quality data (used as a quality/age guardrail).
    # If Variance > threshold, confidence drops.
    max_variance_threshold: 0.11              # Data with variance > 0.11 (old/border data) is penalized.
                                              # To DISABLE: Set to a high value like 100.0.
    
    # Controls how quickly old data fades away (time-based penalization).
    time_decay: 10.0                          # Time (seconds) until data confidence significantly drops.
                                              # To DISABLE: Set to a very high value (e.g., 1000.0).

