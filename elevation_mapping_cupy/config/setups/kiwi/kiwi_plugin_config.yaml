# min_filter:                                   
#   enable: True                                # weather to load this plugin
#   fill_nan: True                             # Fill nans to invalid cells of elevation layer.
#   is_height_layer: True                       # If this is a height layer (such as elevation) or not (such as traversability)
#   layer_name: "min_filter"                    # The layer name.
#   extra_params:                               # This params are passed to the plugin class on initialization.
#     dilation_size: 1                         # The patch size to apply (21x21 patch - very large for smoothing)
#     iteration_n: 15                           # The number of iterations. Increased to better smooth false height differences during orientation changes.

slope:
  enable: True
  fill_nan: False                             # Don't fill NaN - slope is only valid where normals exist
  is_height_layer: False                      # Slope is an angle, not a height
  layer_name: "slope"
  extra_params:
    output_units: "degrees"                   # 'degrees' for [0, 90] or 'radians' for [0, pi/2]
    
    # Robust filtering pipeline (handles camera pose errors & noise)
    enable_robust_filtering: True             # Enable multi-stage filtering
    
    # Stage 1: Variance filtering
    max_variance_threshold: 100.0             # Relaxed: accept almost everything initially
    
    # Stage 2: Outlier detection (detects fake walls from pose errors)
    enable_outlier_detection: True            # Detect elevation outliers
    outlier_threshold: 0.2                    # Relaxed: 1.0m threshold
    outlier_kernel_size: 2                    # neighborhood size (5x5) for outlier detection
    
    # Stage 3: Spatial filtering
    enable_spatial_filter: True               # Apply median filter to normals
    spatial_filter_size: 6                    # median filter kernel (3x3)
    
    # Stage 4: Temporal smoothing (balanced for dynamic obstacles)
    enable_temporal_smoothing: False           # Use historical normal data
    temporal_alpha: 0.6                       # 0.7 = balanced (0.0=max smooth, 1.0=instant response)
    
    # Stage 5: Confidence weighting
    enable_confidence_weighting: True         # Weight slopes by reliability
    time_decay: 15.0                           # seconds, confidence decay for old data

